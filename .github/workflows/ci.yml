name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build DesktopPet.sln -c Release --nologo

      - name: Test
        run: dotnet test tests/DesktopPet.Tests/DesktopPet.Tests.csproj -c Release --nologo

      # Publishing is where asset embedding and single-file packaging can quietly break, and a
      # broken artifact is only noticed at release time otherwise.
      - name: Verify the release artifact still builds as one file
        shell: pwsh
        run: |
          dotnet publish src/DesktopPet/DesktopPet.csproj -c Release -o dist --nologo
          Remove-Item dist/*.pdb -Force -ErrorAction SilentlyContinue
          $stray = Get-ChildItem dist | Where-Object { $_.Name -ne 'PixelPaws.exe' }
          if ($stray) { throw "Publish produced more than the exe: $($stray.Name -join ', ')" }
          $mb = [math]::Round((Get-Item dist/PixelPaws.exe).Length / 1MB, 1)
          Write-Host "PixelPaws.exe is $mb MB"
